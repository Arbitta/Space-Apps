services:
  earthlens:
    build:
      context: .
      dockerfile: Dockerfile
    image: earthlens:latest
    container_name: earthlens-app
    ports:
      - "${HOST_PORT:-5000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - EARTHLENS_LIVE_NASA=0
    # Se monta el directorio actual en /workspace (solo lectura) y NO sobre /app.
    # Así, aunque cambies de rama en Git a una rama donde falten archivos,
    # el contenedor conserva todos sus módulos funcionando desde /app_baked.
    volumes:
      - .:/workspace:ro
    restart: unless-stopped
